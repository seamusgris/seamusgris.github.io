<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nexus Stars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Odibee+Sans&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e9e9e7;
      --window: #f6f6f4;
      --bar: #dededb;
      --ink: #262626;
      --muted: #6b6b68;
      --line: #c9c9c5;
      --active: #262626;
      --active-ink: #f6f6f4;
      --title: "Odibee Sans", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
      --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #151617;
        --window: #202123;
        --bar: #2a2b2d;
        --ink: #ececea;
        --muted: #9a9a96;
        --line: #3a3b3d;
        --active: #ececea;
        --active-ink: #202123;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #151617;
      --window: #202123;
      --bar: #2a2b2d;
      --ink: #ececea;
      --muted: #9a9a96;
      --line: #3a3b3d;
      --active: #ececea;
      --active-ink: #202123;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      display: grid;
      place-items: center;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    .window {
      width: min(960px, 100%);
      height: min(760px, 100%);
      background: var(--window);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .bar {
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 24px;
    }
    h1 {
      font-family: var(--title);
      font-weight: 400;
      font-size: 2rem;
      line-height: 1;
      margin: 0;
      letter-spacing: 0.01em;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    .tab {
      font: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .tab:hover { border-color: var(--ink); }
    .tab[aria-selected="true"] {
      background: var(--active);
      color: var(--active-ink);
      border-color: var(--active);
    }
    .tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .viewer { flex: 1; min-height: 0; background: var(--window); }
    .viewer iframe { width: 100%; height: 100%; border: 0; display: block; }

    .foot {
      border-top: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
    }
    .desc { margin: 0; font-size: 0.9rem; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .btn {
      font: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 14px;
    }
    .btn:hover { border-color: var(--ink); }
    .btn.primary { background: var(--active); color: var(--active-ink); border-color: var(--active); }

    @media (max-width: 560px) {
      body { padding: 0; }
      .window { border-radius: 0; border-left: 0; border-right: 0; height: 100%; }
      .tabs { margin-left: 0; }
      .actions { width: 100%; }
      .btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>

  <main class="window">
    <header class="bar">
      <h1>Nexus Stars</h1>
      <div class="tabs" role="tablist" aria-label="Documentos">
        <button class="tab" role="tab" data-i="0" aria-selected="true">Guia</button>
        <button class="tab" role="tab" data-i="1" aria-selected="false">Ficha de personagem</button>
        <button class="tab" role="tab" data-i="2" aria-selected="false">Ficha de nave</button>
      </div>
    </header>

    <div class="viewer">
      <iframe id="frame" title="Visualizador de PDF"></iframe>
    </div>

    <footer class="foot">
      <p class="desc" id="desc"></p>
      <div class="actions">
        <a class="btn" id="open" target="_blank" rel="noopener">Abrir em nova aba</a>
        <a class="btn primary" id="download" download>Baixar PDF</a>
      </div>
    </footer>
  </main>

  <script>
    // Ajuste os nomes dos arquivos se necessário (devem estar na mesma pasta desta página).
    const docs = [
      { file: "Nexus Stars.pdf", desc: "Guia do módulo de ópera espacial." },
      { file: "Nexus Stars - Ficha de Personagem.pdf", desc: "Ficha com o guia de criação de personagem." },
      { file: "Nexus-Stars-Ficha-de-Nave.pdf", desc: "Ficha de nave com o guia de montagem e custos." }
    ];

    const frame = document.getElementById("frame");
    const desc = document.getElementById("desc");
    const openBtn = document.getElementById("open");
    const downloadBtn = document.getElementById("download");
    const tabs = document.querySelectorAll(".tab");

    function show(i) {
      const d = docs[i];
      frame.src = d.file + "#view=FitH";
      desc.textContent = d.desc;
      openBtn.href = d.file;
      downloadBtn.href = d.file;
      tabs.forEach((t, n) => t.setAttribute("aria-selected", String(n === i)));
      try { history.replaceState(null, "", "#" + ["guia", "personagem", "nave"][i]); } catch (e) {}
    }

    tabs.forEach(t => t.addEventListener("click", () => show(Number(t.dataset.i))));

    const start = ["#guia", "#personagem", "#nave"].indexOf(location.hash);
    show(start > -1 ? start : 0);
  </script>
</body>
</html>
